[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poe-ggpk-extractor"
version = "0.1.0"
description = "Data extractor for Path of Exile's Content.ggpk (GGPK, Oodle bundles and .datc64 tables)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elian Bineder" }]
keywords = ["path of exile", "ggpk", "datamining", "game data", "oodle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",     # texture preview and conversion
    "pyooz>=0.0.8",   # open-source Oodle decompressor (GPL-3.0-or-later)
    "numpy>=1.24",    # vectorized hashing of ~1-4 million paths
]

[project.urls]
Homepage = "https://github.com/elianbineder/poe-ggpk-extractor"
Documentation = "https://github.com/elianbineder/poe-ggpk-extractor/blob/main/docs/FORMAT.md"
Issues = "https://github.com/elianbineder/poe-ggpk-extractor/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poe-ggpk = "poe_ggpk.cli:main"

[project.gui-scripts]
poe-ggpk-gui = "poe_ggpk.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real game installation (POE_GGPK or default paths)"]
